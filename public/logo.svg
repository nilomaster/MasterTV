<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111927" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded TV Card with Neon Glow -->
  <rect x="10" y="10" width="100" height="100" rx="26" fill="url(#bgGrad)" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.6" filter="url(#glow)"/>
  
  <!-- TV Screen Inner Frame -->
  <rect x="24" y="28" width="72" height="52" rx="14" fill="#0D1322" stroke="url(#glowGrad)" stroke-width="2.5" />
  
  <!-- Stylized Play Icon with Modern Curve -->
  <path d="M52 42 L74 54 L52 66 Z" fill="url(#glowGrad)" />
  <circle cx="84" cy="22" r="3.5" fill="#00F0FF" filter="url(#glow)" />
  <line x1="78" y1="28" x2="84" y2="22" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Subtle Stand Base -->
  <path d="M48 92 H72" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="60" y1="80" x2="60" y2="92" stroke="#00F0FF" stroke-width="2.5" opacity="0.8" />
</svg>

